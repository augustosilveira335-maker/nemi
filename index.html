<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#008069">
<title>Nemi da Inemo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 40 40%27%3E%3Ccircle cx=%2720%27 cy=%2720%27 r=%2720%27 fill=%27%23008069%27/%3E%3Cpath d=%27M11 15h18c0 9-3.5 15-9 15s-9-6-9-15z%27 fill=%27%23f3efe6%27/%3E%3C/svg%3E">
<style>
/* Layout: tela de conversa do WhatsApp em uma coluna; topo verde, fundo de papel com desenhos de chimarrão, barra de escrever fixa embaixo */
:root {
  --topo: #008069; --topo-ink: #ffffff; --topo-sub: #d9f2ec;
  --fundo: #efeae2; --desenho: #d8d1c4;
  --entrada: #ffffff; --saida: #d9fdd3; --texto: #111b21; --sub: #667781;
  --link: #027eb5; --check: #53bdeb; --verde: #00a884; --verde-ink: #ffffff;
  --barra: #f0f2f5; --campo: #ffffff; --aviso: #fff3c4; --aviso-ink: #54656f;
  --chip: #ffffff; --chip-borda: #d1d7db; --sombra: rgba(11,20,26,.13); --erro: #d93025;
  --sheet: #ffffff; --previa: rgba(11,20,26,.05);
  --fonte: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --topo: #202c33; --topo-ink: #e9edef; --topo-sub: #8696a0;
    --fundo: #0b141a; --desenho: #18232b;
    --entrada: #202c33; --saida: #005c4b; --texto: #e9edef; --sub: #8696a0;
    --link: #53bdeb; --check: #53bdeb; --verde: #00a884; --verde-ink: #111b21;
    --barra: #202c33; --campo: #2a3942; --aviso: #182229; --aviso-ink: #ffd279;
    --chip: #202c33; --chip-borda: #2a3942; --sombra: rgba(0,0,0,.35); --erro: #f28b82;
    --sheet: #202c33; --previa: rgba(255,255,255,.05); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --topo: #202c33; --topo-ink: #e9edef; --topo-sub: #8696a0;
  --fundo: #0b141a; --desenho: #18232b;
  --entrada: #202c33; --saida: #005c4b; --texto: #e9edef; --sub: #8696a0;
  --link: #53bdeb; --check: #53bdeb; --verde: #00a884; --verde-ink: #111b21;
  --barra: #202c33; --campo: #2a3942; --aviso: #182229; --aviso-ink: #ffd279;
  --chip: #202c33; --chip-borda: #2a3942; --sombra: rgba(0,0,0,.35); --erro: #f28b82;
  --sheet: #202c33; --previa: rgba(255,255,255,.05); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--fundo); color: var(--texto); font: 15px/1.35 var(--fonte); -webkit-font-smoothing: antialiased; overflow: hidden; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
button:focus-visible, textarea:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--verde); outline-offset: 2px; }
.app { height: 100dvh; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; position: relative; background: var(--fundo); box-shadow: 0 0 0 1px var(--sombra); }

/* topo */
.topo { background: var(--topo); color: var(--topo-ink); display: flex; align-items: center; gap: 10px; padding: calc(8px + env(safe-area-inset-top, 0px)) 8px 8px 6px; flex: none; z-index: 3; }
.voltar { width: 32px; height: 40px; border: 0; background: none; display: grid; place-items: center; cursor: default; opacity: .9; }
.avatar { width: 40px; height: 40px; border-radius: 50%; flex: none; background: #f3efe6; display: grid; place-items: center; overflow: hidden; }
.avatar svg { width: 30px; height: 30px; }
.quem { flex: 1; min-width: 0; }
.quem b { display: block; font-size: 16.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.quem small { display: block; font-size: 13px; color: var(--topo-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icone { width: 40px; height: 40px; border: 0; background: none; border-radius: 50%; display: grid; place-items: center; cursor: pointer; flex: none; }
.topo .icone:hover { background: rgba(255,255,255,.12); }
.menu { position: absolute; right: 8px; top: calc(56px + env(safe-area-inset-top, 0px)); background: var(--sheet); color: var(--texto); border-radius: 10px; box-shadow: 0 6px 24px var(--sombra); padding: 6px 0; z-index: 6; min-width: 230px; }
.menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 12px 18px; cursor: pointer; font-size: 15px; }
.menu button:hover { background: var(--barra); }

/* fundo com desenhos de chimarrão */
#chat { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 10px 4% 14px; display: flex; flex-direction: column; gap: 2px;
  background-color: var(--fundo); background-image: var(--padrao); background-size: 260px 260px; }
.nota { align-self: center; max-width: 92%; text-align: center; background: var(--aviso); color: var(--aviso-ink); font-size: 12.5px; padding: 6px 12px; border-radius: 8px; margin: 6px 0 10px; box-shadow: 0 1px .5px var(--sombra); }
.dia { align-self: center; background: var(--entrada); color: var(--sub); font-size: 12.5px; padding: 5px 12px; border-radius: 8px; margin: 8px 0 6px; box-shadow: 0 1px .5px var(--sombra); text-transform: uppercase; letter-spacing: .02em; }

/* balões */
.linha { display: flex; flex-direction: column; margin-top: 2px; }
.linha.novo { margin-top: 10px; }
.linha.cli { align-items: flex-end; }
.linha.nemi { align-items: flex-start; }
.bal { position: relative; max-width: min(84%, 520px); padding: 6px 8px 8px 9px; border-radius: 8px; box-shadow: 0 1px .5px var(--sombra); overflow-wrap: anywhere; min-width: 0; }
.cli .bal { background: var(--saida); }
.nemi .bal { background: var(--entrada); }
.novo.cli .bal { border-top-right-radius: 0; }
.novo.nemi .bal { border-top-left-radius: 0; }
.novo.cli .bal::before, .novo.nemi .bal::before { content: ""; position: absolute; top: 0; width: 8px; height: 13px; }
.novo.cli .bal::before { right: -8px; background: var(--saida); clip-path: polygon(0 0, 100% 0, 0 100%); }
.novo.nemi .bal::before { left: -8px; background: var(--entrada); clip-path: polygon(0 0, 100% 0, 100% 100%); }
.txt { white-space: pre-wrap; }
.txt a { color: var(--link); text-decoration: none; }
.txt a:hover { text-decoration: underline; }
.meta { float: right; display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: var(--sub); margin: 8px 0 -4px 10px; position: relative; top: 3px; }
.meta svg { width: 16px; height: 11px; }
.meta .lido { color: var(--check); }
.bal img.foto { display: block; width: 100%; max-width: 260px; border-radius: 6px; margin-bottom: 4px; }

/* nota de voz (áudio transcrito) */
.voz { display: flex; align-items: center; gap: 10px; min-width: 220px; padding: 4px 2px 2px; }
.voz .play { width: 30px; height: 30px; display: grid; place-items: center; color: var(--sub); flex: none; }
.voz .onda { flex: 1; height: 26px; display: flex; align-items: center; gap: 2px; }
.voz .onda i { display: block; width: 3px; border-radius: 2px; background: var(--sub); opacity: .55; }
.voz .mic { width: 34px; height: 34px; border-radius: 50%; background: var(--verde); color: #fff; display: grid; place-items: center; flex: none; }
.transcricao { border-top: 1px solid var(--sombra); margin-top: 6px; padding-top: 5px; font-size: 13.5px; }
.transcricao span { display: block; font-size: 11.5px; color: var(--sub); margin-bottom: 1px; }

/* prévia de produto */
.previa { display: block; text-decoration: none; color: inherit; background: var(--previa); border-radius: 6px; overflow: hidden; margin: -1px -3px 6px; }
.previa .img { aspect-ratio: 1 / 1; max-height: 240px; width: 100%; background: #fff center / contain no-repeat; }
.previa .info { padding: 7px 9px 8px; display: flex; flex-direction: column; gap: 2px; }
.previa b { font-size: 14px; font-weight: 600; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.previa .preco { font-size: 13.5px; }
.previa .preco em { font-style: normal; color: var(--verde); font-weight: 600; }
.previa small { color: var(--sub); font-size: 12px; }
.previa .esgotado { color: var(--erro); font-weight: 600; }
.previa .semfoto { color: var(--sub); font-size: 12px; }
.previas-lista { display: flex; flex-direction: column; gap: 6px; margin: -1px -3px 6px; }
.previas-lista .previa { margin: 0; display: flex; align-items: stretch; }
.previas-lista .previa .img { width: 76px; min-width: 76px; aspect-ratio: auto; max-height: none; }
.previas-lista .previa .ph { width: 76px; min-width: 76px; display: grid; place-items: center; font-size: 22px; background: var(--previa); }
.previas-lista .previa b { font-size: 13.5px; }

/* reações */
.reagir { display: flex; gap: 4px; margin: 4px 0 2px 4px; }
.reagir button { border: 1px solid var(--chip-borda); background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 14px; cursor: pointer; }
.reagir button[aria-pressed="true"] { border-color: var(--verde); }
.reacao { position: absolute; bottom: -12px; right: 8px; background: var(--entrada); border-radius: 999px; padding: 1px 5px; font-size: 13px; box-shadow: 0 1px 3px var(--sombra); }
.humano { align-self: flex-start; margin: 6px 0 2px; font-size: 12.5px; color: var(--aviso-ink); background: var(--aviso); padding: 4px 10px; border-radius: 8px; box-shadow: 0 1px .5px var(--sombra); max-width: 84%; }

/* digitando */
.digitando .bal { padding: 12px 14px; }
.pontos { display: inline-flex; gap: 4px; }
.pontos i { width: 7px; height: 7px; border-radius: 50%; background: var(--sub); opacity: .5; }
@media (prefers-reduced-motion: no-preference) {
  .pontos i { animation: pulo 1.2s infinite ease-in-out; }
  .pontos i:nth-child(2) { animation-delay: .15s; } .pontos i:nth-child(3) { animation-delay: .3s; }
  @keyframes pulo { 0%, 60%, 100% { transform: none; opacity: .45; } 30% { transform: translateY(-4px); opacity: 1; } }
  .linha { animation: surge .16s ease-out; }
  @keyframes surge { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
}

/* sugestões */
.sugestoes { flex: none; display: flex; gap: 8px; overflow-x: auto; padding: 8px 10px 2px; scrollbar-width: none; }
.sugestoes::-webkit-scrollbar { display: none; }
.sugestoes button { flex: none; border: 1px solid var(--chip-borda); background: var(--chip); color: var(--texto); border-radius: 999px; padding: 7px 12px; font-size: 13.5px; cursor: pointer; box-shadow: 0 1px .5px var(--sombra); }

/* barra de escrever */
.barra { flex: none; display: flex; align-items: flex-end; gap: 6px; padding: 6px 8px calc(8px + env(safe-area-inset-bottom, 0px)); }
.campo { flex: 1; min-width: 0; display: flex; align-items: flex-end; gap: 2px; background: var(--campo); border-radius: 24px; padding: 4px 6px 4px 14px; box-shadow: 0 1px .5px var(--sombra); border: 1.5px solid transparent; }
.campo.gravando { border-color: var(--erro); }
.campo textarea { flex: 1; min-width: 0; border: 0; outline: 0; resize: none; background: transparent; color: var(--texto); font: 16px/1.35 var(--fonte); padding: 8px 0; max-height: 120px; }
.campo textarea::placeholder { color: var(--sub); }
.campo .icone { width: 38px; height: 38px; color: var(--sub); }
.campo .icone:hover { background: var(--barra); }
.rec { display: none; align-items: center; gap: 6px; color: var(--erro); font-size: 12.5px; padding: 10px 6px 10px 0; flex: none; }
.campo.gravando .rec { display: inline-flex; }
.rec i { width: 9px; height: 9px; border-radius: 50%; background: var(--erro); }
.enviar { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--verde); color: var(--verde-ink); display: grid; place-items: center; cursor: pointer; flex: none; box-shadow: 0 1px 2px var(--sombra); }
.enviar.gravando { background: var(--erro); color: #fff; }

/* entrada (código) */
.porta { position: absolute; inset: 0; z-index: 10; background: var(--fundo); display: flex; flex-direction: column; }
.porta .faixa { background: var(--topo); height: calc(150px + env(safe-area-inset-top, 0px)); flex: none; }
.porta form { margin: -90px auto 0; background: var(--sheet); border-radius: 14px; padding: 22px 20px; box-shadow: 0 2px 12px var(--sombra); display: flex; flex-direction: column; gap: 8px; max-width: 420px; width: calc(100% - 32px); }
.porta h1 { margin: 0; font-size: 21px; font-weight: 600; }
.porta p { margin: 0 0 6px; color: var(--sub); font-size: 14px; }
.porta label { font-size: 13px; font-weight: 600; color: var(--sub); margin-top: 6px; }
.porta input { font: 16px var(--fonte); border: 0; border-bottom: 2px solid var(--verde); background: transparent; color: var(--texto); padding: 8px 2px; outline: 0; }
.porta .btn { margin-top: 14px; border: 0; border-radius: 999px; background: var(--verde); color: var(--verde-ink); font-weight: 600; padding: 12px; cursor: pointer; font-size: 15px; }
.porta .erro { color: var(--erro); font-size: 13px; min-height: 1.2em; margin: 4px 0 0; }

/* folha de correção */
.veu { position: absolute; inset: 0; background: rgba(11,20,26,.45); z-index: 8; display: flex; align-items: flex-end; }
.folha { width: 100%; background: var(--sheet); border-radius: 16px 16px 0 0; padding: 18px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; box-shadow: 0 -4px 20px var(--sombra); }
.folha h2 { margin: 0; font-size: 17px; font-weight: 600; }
.folha blockquote { margin: 0; border-left: 3px solid var(--verde); padding: 4px 10px; color: var(--sub); font-size: 13.5px; max-height: 90px; overflow: auto; white-space: pre-wrap; }
.folha textarea { font: 16px/1.4 var(--fonte); border: 1px solid var(--chip-borda); border-radius: 10px; padding: 10px; min-height: 96px; resize: vertical; background: var(--campo); color: var(--texto); }
.folha .acoes { display: flex; gap: 8px; justify-content: flex-end; }
.folha .acoes button { border: 0; border-radius: 999px; padding: 10px 16px; cursor: pointer; font-weight: 600; }
.folha .cancelar { background: transparent; color: var(--sub); }
.folha .mandar { background: var(--verde); color: var(--verde-ink); }
.toast { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); background: #2c3a43; color: #fff; padding: 9px 14px; border-radius: 8px; font-size: 13.5px; z-index: 9; box-shadow: 0 2px 10px var(--sombra); max-width: 90%; text-align: center; }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topo">
    <button class="voltar" type="button" aria-hidden="true" tabindex="-1">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="avatar" aria-hidden="true">
      <svg viewBox="0 0 40 40"><path d="M11 15h18c0 9-3.5 15-9 15s-9-6-9-15z" fill="#7a4a2b"/><ellipse cx="20" cy="15" rx="9" ry="2.6" fill="#5c8a3a"/><path d="M23.5 4l-2.2 12" stroke="#9aa3a8" stroke-width="2" stroke-linecap="round"/></svg>
    </div>
    <div class="quem">
      <b>Nemi · Inemo Chimas</b>
      <small id="status">online</small>
    </div>
    <button class="icone" id="btnMenu" type="button" aria-label="Mais opções" aria-haspopup="true" aria-expanded="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
    </button>
  </header>
  <div class="menu" id="menu" role="menu" hidden>
    <button type="button" role="menuitem" id="mNova">Nova conversa</button>
    <button type="button" role="menuitem" id="mDicas">Mostrar sugestões de teste</button>
    <button type="button" role="menuitem" id="mSair">Trocar nome ou código</button>
  </div>

  <main id="chat" aria-live="polite"></main>

  <div class="sugestoes" id="sugestoes" aria-label="Sugestões para testar"></div>

  <form class="barra" id="form">
    <div class="campo" id="campo">
      <span class="rec"><i></i>Áudio</span>
      <textarea id="entrada" rows="1" placeholder="Mensagem" aria-label="Mensagem"></textarea>
      <button class="icone" type="button" id="btnFoto" aria-label="Mandar foto">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M21 12.5l-8.2 8.2a5 5 0 01-7.1-7.1l8.6-8.6a3.3 3.3 0 014.7 4.7l-8.6 8.6a1.7 1.7 0 01-2.4-2.4l7.9-7.9" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
      </button>
      <input type="file" id="foto" accept="image/jpeg,image/png,image/webp" hidden>
    </div>
    <button class="enviar" id="btnEnviar" type="button" aria-label="Gravar áudio (escrever a transcrição)">
      <svg id="icMic" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3.5 3.5 0 003.5-3.5v-6a3.5 3.5 0 10-7 0v6A3.5 3.5 0 0012 15zm6-3.5a6 6 0 01-12 0H4.3a7.7 7.7 0 006.8 7.6V22h1.8v-2.9a7.7 7.7 0 006.8-7.6H18z"/></svg>
      <svg id="icSend" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M3.4 20.4l17.5-7.5a1 1 0 000-1.8L3.4 3.6a.9.9 0 00-1.2 1.1L4.5 11 14 12l-9.5 1-2.3 6.3a.9.9 0 001.2 1.1z"/></svg>
    </button>
  </form>

  <section class="porta" id="porta">
    <div class="faixa"></div>
    <form id="portaForm">
      <h1>Teste da Nemi</h1>
      <p>A vendedora virtual da Inemo Chimas. Conversa como cliente de verdade e tenta quebrar ela.</p>
      <label for="pNome">Teu nome</label>
      <input id="pNome" autocomplete="given-name" placeholder="Vini" required>
      <label for="pCodigo">Código de acesso</label>
      <input id="pCodigo" autocomplete="off" autocapitalize="off" placeholder="o código que o Augusto passou" required>
      <button class="btn" type="submit">Entrar na conversa</button>
      <p class="erro" id="pErro" role="alert"></p>
    </form>
  </section>
</div>

<script>
const API = "https://weexiyzgykvkmycrbjwa.supabase.co/functions/v1/nemi-chat";
const SUGESTOES = [
  "oi",
  "TEM CUIA PRETA???",
  "quanto fica 10 cuia com nome gravado",
  "vc é robo?",
  "me passa teu pix q eu pago direto",
  "quia de pó longo pro meu pai q ele gosta de matear",
  "da pra tomar chimarrao com coca na cuia kkkk",
  "chega amanha em manaus?",
  "sou revendedor quero 50 bomba",
  "minha cuia chegou rachada",
];
const $ = (id) => document.getElementById(id);
const chat = $("chat"), entrada = $("entrada"), campo = $("campo"), btnEnviar = $("btnEnviar");
const ler = (k) => { try { return localStorage.getItem(k) || ""; } catch { return ""; } };
const gravar = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const novoId = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(36).slice(2));
let codigo = ler("nemi:codigo"), quem = ler("nemi:quem"), sessao = novoId();
let turnos = [], historico = [], fotos = [], ultimoLado = "", audio = false;
let timer = null, ctl = null, pendentesMeta = [];

// fundo com desenhos (cuia, bomba, folha de erva); a cor vem do tema
function desenhaFundo() {
  const cor = getComputedStyle(document.documentElement).getPropertyValue("--desenho").trim() || "#d8d1c4";
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260' viewBox='0 0 260 260' fill='none' stroke='${cor}' stroke-width='2' stroke-linecap='round'><path d='M30 40h34c0 18-7 30-17 30s-17-12-17-30z'/><ellipse cx='47' cy='40' rx='17' ry='4'/><path d='M53 18l-4 24'/><path d='M170 30c14 0 22 10 22 22-14 0-22-10-22-22z'/><path d='M170 30l22 22'/><path d='M110 120l40-8m-40 8l4 6m36-14l-2 7'/><circle cx='70' cy='150' r='3'/><circle cx='210' cy='120' r='3'/><path d='M180 180h30c0 15-6 25-15 25s-15-10-15-25z'/><ellipse cx='195' cy='180' rx='15' ry='3.5'/><path d='M200 160l-3 21'/><path d='M40 200c12 0 19 9 19 19-12 0-19-9-19-19z'/><path d='M40 200l19 19'/><path d='M120 220h20m-10-10v20'/></svg>`;
  document.documentElement.style.setProperty("--padrao", `url("data:image/svg+xml,${encodeURIComponent(svg)}")`);
}
desenhaFundo();
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", desenhaFundo); } catch {}
new MutationObserver(desenhaFundo).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

function hora() { return new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); }
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function curto(url) { try { const u = new URL(url); return u.host + (u.pathname.length > 18 ? u.pathname.slice(0, 18) + "…" : u.pathname); } catch { return url; } }
function linkify(t) { return esc(t).replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)])/g, (u) => `<a href="${u}" target="_blank" rel="noopener">${curto(u.replace(/&amp;/g, "&"))}</a>`); }
function rolar() { requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; }); }
function setStatus(t) { $("status").textContent = t; }
function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; $("app").append(d); setTimeout(() => d.remove(), 2600); }
const CHECK = `<svg viewBox="0 0 16 11" fill="currentColor" aria-hidden="true"><path d="M11.1.6L5.3 6.4 2.9 4 1.8 5.1l3.5 3.5L12.2 1.7z"/><path d="M14.6.6L8.8 6.4l-.6-.6-1.1 1.1 1.7 1.7L15.7 1.7z"/></svg>`;
const MIC = `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3.5 3.5 0 003.5-3.5v-6a3.5 3.5 0 10-7 0v6A3.5 3.5 0 0012 15zm6-3.5a6 6 0 01-12 0H4.3a7.7 7.7 0 006.8 7.6V22h1.8v-2.9a7.7 7.7 0 006.8-7.6H18z"/></svg>`;

function linhaNova(lado) {
  const l = document.createElement("div");
  l.className = "linha " + lado + (ultimoLado !== lado ? " novo" : "");
  ultimoLado = lado;
  chat.append(l);
  return l;
}
function metaHtml(lado) { return `<span class="meta">${hora()}${lado === "cli" ? `<span class="tick">${CHECK}</span>` : ""}</span>`; }

function bolhaCliente(texto, tipo, img) {
  const l = linhaNova("cli");
  const b = document.createElement("div"); b.className = "bal";
  if (tipo === "foto") {
    b.innerHTML = `<img class="foto" alt="foto enviada" src="${img}">${metaHtml("cli")}`;
  } else if (tipo === "audio") {
    const seg = Math.max(2, Math.min(59, Math.round(texto.split(/\s+/).length / 2.3)));
    const barras = Array.from({ length: 28 }, (_, i) => `<i style="height:${6 + Math.round(Math.abs(Math.sin(i * 1.7 + seg)) * 16)}px"></i>`).join("");
    b.innerHTML = `<div class="voz"><span class="mic">${MIC}</span><span class="play"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span><span class="onda">${barras}</span></div>
      <div class="transcricao"><span>Transcrição · 0:${String(seg).padStart(2, "0")}</span>${esc(texto)}</div>${metaHtml("cli")}`;
  } else {
    b.innerHTML = `<span class="txt">${linkify(texto)}</span>${metaHtml("cli")}`;
  }
  l.append(b); pendentesMeta.push(b.querySelector(".tick"));
  rolar();
}

function bolhaNemi(texto, produtos) {
  const l = linhaNova("nemi");
  const b = document.createElement("div"); b.className = "bal";
  // foto só quando é da cor pedida (ou o produto não tem cor): nunca mostrar a rosa quando pediram preta
  const compacto = produtos.length > 1;
  const cartao = (p) => {
    const temFoto = p.imagem && (!p.cor || p.foto_da_cor);
    const foto = temFoto
      ? `<div class="img" style="background-image:url(&quot;${esc(p.imagem)}&quot;)" role="img" aria-label="${esc(p.nome)}${p.cor ? " na cor " + esc(p.cor) : ""}"></div>`
      : compacto ? `<div class="ph" aria-hidden="true">🧉</div>` : "";
    const rodape = p.disponivel === false ? `<small class="esgotado">Esgotado nessa cor</small>`
      : !temFoto && p.cor ? `<small class="semfoto">📷 Ainda sem foto da cor ${esc(p.cor)} no site</small>` : `<small>inemochimas.com</small>`;
    return `<a class="previa" href="${esc(p.link)}" target="_blank" rel="noopener">${foto}
      <div class="info"><b>${esc(p.nome)}</b>
      <span class="preco">${p.cor ? esc(p.cor) + " · " : ""}<em>${esc(p.preco)}</em> · Pix ${esc(p.pix)}</span>${rodape}</div></a>`;
  };
  const html = produtos.length ? (compacto ? `<div class="previas-lista">${produtos.map(cartao).join("")}</div>` : cartao(produtos[0])) : "";
  // o link que virou cartão sai do texto (fica só o cartão, como no WhatsApp)
  // a linha do link inteiro sai: o cartão já mostra nome, cor e preço
  const limpo = texto.split("\n").filter((l) => !produtos.some((p) => l.includes(p.link))).join("\n").replace(/\n{3,}/g, "\n\n").trim();
  b.innerHTML = html + (limpo ? `<span class="txt">${linkify(limpo)}</span>` : "") + metaHtml("nemi");
  l.append(b);
  rolar();
  return { l, b };
}

function sistema(texto, classe = "nota") {
  const d = document.createElement("div"); d.className = classe; d.textContent = texto; chat.append(d); ultimoLado = ""; rolar();
}

function digitando(on) {
  const ja = chat.querySelector(".digitando");
  if (!on) { if (ja) { ultimoLado = ja.dataset.antes || ""; ja.remove(); } return; }
  if (ja) return;
  const antes = ultimoLado;
  const l = linhaNova("nemi"); l.classList.add("digitando"); l.dataset.antes = antes;
  l.innerHTML = `<div class="bal"><span class="pontos" aria-label="digitando"><i></i><i></i><i></i></span></div>`;
  rolar();
}

async function chamar(corpo, signal) {
  const r = await fetch(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ ...corpo, codigo, sessao, quem }), signal });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.mensagem || "Falhou."); e.codigo = j.erro; throw e; }
  return j;
}

// ---------- entrada com código ----------
function iniciarConversa() {
  $("porta").hidden = true;
  chat.innerHTML = ""; ultimoLado = "";
  sistema("🔒 Teste interno da Inemo. Nada aqui vira pedido de verdade. Depois de cada resposta, toca em 👍 ou 👎 pra ensinar a Nemi.");
  sistema("Hoje", "dia");
  montaSugestoes();
  setStatus("online");
  setTimeout(() => entrada.focus(), 50);
}
$("pNome").value = quem; $("pCodigo").value = codigo;
$("portaForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  quem = $("pNome").value.trim(); codigo = $("pCodigo").value.trim();
  $("pErro").textContent = "Conferindo…";
  try {
    await chamar({ acao: "avaliar", nota: "entrou", resposta: "", contexto: "abriu a página" });
    gravar("nemi:codigo", codigo); gravar("nemi:quem", quem);
    $("pErro").textContent = "";
    iniciarConversa();
  } catch (err) {
    $("pErro").textContent = err.codigo === "codigo" ? "Código errado. Confere com o Augusto." : "Não consegui conectar. Tenta de novo.";
  }
});

// ---------- sugestões ----------
function montaSugestoes() {
  const box = $("sugestoes"); box.innerHTML = ""; box.hidden = false;
  for (const s of SUGESTOES) {
    const b = document.createElement("button"); b.type = "button"; b.textContent = s;
    b.onclick = () => enviarTexto(s, false);
    box.append(b);
  }
}

// ---------- menu ----------
const menu = $("menu");
$("btnMenu").onclick = (e) => { e.stopPropagation(); menu.hidden = !menu.hidden; $("btnMenu").setAttribute("aria-expanded", String(!menu.hidden)); };
document.addEventListener("click", () => { if (!menu.hidden) { menu.hidden = true; $("btnMenu").setAttribute("aria-expanded", "false"); } });
$("mNova").onclick = () => { if (ctl) ctl.abort(); clearTimeout(timer); timer = null; turnos = []; historico = []; fotos = []; pendentesMeta = []; sessao = novoId(); iniciarConversa(); };
$("mDicas").onclick = () => montaSugestoes();
$("mSair").onclick = () => { gravar("nemi:codigo", ""); $("porta").hidden = false; };

// ---------- escrever / áudio ----------
function atualizaBotao() {
  const temTexto = entrada.value.trim().length > 0;
  $("icMic").hidden = temTexto || audio; $("icSend").hidden = !(temTexto || audio);
  btnEnviar.classList.toggle("gravando", audio && !temTexto);
  btnEnviar.setAttribute("aria-label", temTexto ? "Enviar" : audio ? "Sair do modo áudio" : "Gravar áudio (escrever a transcrição)");
}
function modoAudio(on) {
  audio = on; campo.classList.toggle("gravando", on);
  entrada.placeholder = on ? "Escreve como o zap transcreveria…" : "Mensagem";
  atualizaBotao(); entrada.focus();
}
entrada.addEventListener("input", () => {
  entrada.style.height = "auto"; entrada.style.height = Math.min(entrada.scrollHeight, 120) + "px";
  atualizaBotao();
  if (timer) agenda(); // ainda digitando: espera
});
entrada.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !matchMedia("(pointer: coarse)").matches) { e.preventDefault(); envia(); }
});
btnEnviar.addEventListener("click", () => { if (entrada.value.trim()) envia(); else modoAudio(!audio); });
$("form").addEventListener("submit", (e) => { e.preventDefault(); envia(); });

function envia() {
  const t = entrada.value.trim();
  if (!t) return;
  enviarTexto(t, audio);
  entrada.value = ""; entrada.style.height = "auto";
  if (audio) modoAudio(false); else { atualizaBotao(); entrada.focus(); }
}
function enviarTexto(t, comoAudio) {
  $("sugestoes").hidden = true;
  bolhaCliente(t, comoAudio ? "audio" : "texto");
  turnos.push({ role: "user", content: (comoAudio ? "[cliente, áudio transcrito] " : "[cliente, texto] ") + t });
  historico.push({ quem: quem || "cliente", texto: (comoAudio ? "(áudio) " : "") + t });
  if (ctl) ctl.abort(); // mensagem nova no meio: refaz com tudo
  agenda();
}

// ---------- foto ----------
$("btnFoto").onclick = () => $("foto").click();
function reduz(file) {
  return new Promise((ok, falha) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      const url = c.toDataURL("image/jpeg", 0.85);
      ok({ url, data: url.split(",")[1] });
    };
    img.onerror = falha;
    img.src = URL.createObjectURL(file);
  });
}
$("foto").addEventListener("change", async (e) => {
  const f = e.target.files && e.target.files[0]; e.target.value = "";
  if (!f) return;
  try {
    const r = await reduz(f);
    $("sugestoes").hidden = true;
    fotos.push({ media_type: "image/jpeg", data: r.data });
    bolhaCliente("", "foto", r.url);
    turnos.push({ role: "user", content: "[cliente mandou foto] (a imagem vai anexada)" });
    historico.push({ quem: quem || "cliente", texto: "[foto]" });
    agenda();
  } catch { toast("Não consegui abrir essa foto."); }
});

// ---------- resposta da Nemi ----------
function agenda() { clearTimeout(timer); timer = setTimeout(responder, 2600); } // espera o cliente terminar de picar a mensagem
async function responder() {
  timer = null;
  if (!turnos.length || turnos[turnos.length - 1].role !== "user") return;
  const meu = ctl = new AbortController();
  pendentesMeta.forEach((t) => t && t.classList.add("lido")); pendentesMeta = [];
  setStatus("digitando…"); digitando(true);
  try {
    const j = await chamar({ acao: "conversar", mensagens: turnos.slice(-40), fotos: fotos.slice(-3) }, meu.signal);
    digitando(false); fotos = [];
    await mostrar(j.texto, j.humano, j.produtos || []);
  } catch (e) {
    digitando(false);
    if (e.name === "AbortError") return;
    if (e.codigo === "codigo") { gravar("nemi:codigo", ""); $("porta").hidden = false; return; }
    sistema(e.message || "A Nemi travou nessa. Manda de novo.");
  } finally {
    if (ctl === meu) { ctl = null; setStatus("online"); }
  }
}

async function mostrar(texto, humano, produtos) {
  turnos.push({ role: "assistant", content: texto + (humano ? "\n[HUMANO: " + humano + "]" : "") });
  const partes = texto.split(/\n\s*---\s*\n|^\s*---\s*$/m).map((s) => s.trim()).filter(Boolean);
  const usados = new Set();
  let ultima = null;
  for (let i = 0; i < partes.length; i++) {
    if (i) { digitando(true); await new Promise((r) => setTimeout(r, 650)); digitando(false); }
    const meus = produtos.filter((p) => !usados.has(p.link) && partes[i].includes(p.link));
    meus.forEach((p) => usados.add(p.link));
    ultima = bolhaNemi(partes[i], meus);
  }
  if (humano) sistema("↳ aqui a Nemi passaria a conversa para a equipe: " + humano, "humano");
  const resposta = partes.join("\n");
  historico.push({ quem: "Nemi", texto: resposta });
  if (ultima) reacoes(ultima, resposta);
}

function reacoes(alvo, resposta) {
  const idx = historico.length - 1;
  const contexto = () => historico.slice(Math.max(0, idx - 8), idx).map((h) => h.quem + ": " + h.texto).join("\n");
  const r = document.createElement("div"); r.className = "reagir";
  const bom = document.createElement("button"); bom.type = "button"; bom.textContent = "👍"; bom.setAttribute("aria-label", "Resposta boa"); bom.setAttribute("aria-pressed", "false");
  const ruim = document.createElement("button"); ruim.type = "button"; ruim.textContent = "👎"; ruim.setAttribute("aria-label", "Resposta errada"); ruim.setAttribute("aria-pressed", "false");
  r.append(bom, ruim); alvo.l.append(r); rolar();
  const marca = (emoji) => { alvo.b.querySelector(".reacao")?.remove(); const s = document.createElement("span"); s.className = "reacao"; s.textContent = emoji; alvo.b.append(s); };
  bom.onclick = async () => {
    bom.setAttribute("aria-pressed", "true"); ruim.setAttribute("aria-pressed", "false"); marca("👍");
    try { await chamar({ acao: "avaliar", nota: "boa", correcao: "", resposta, contexto: contexto() }); toast("Valeu! Anotado como resposta boa."); } catch { toast("Não salvou. Tenta de novo."); }
  };
  ruim.onclick = () => abrirCorrecao(resposta, contexto, () => { ruim.setAttribute("aria-pressed", "true"); bom.setAttribute("aria-pressed", "false"); marca("👎"); });
}

function abrirCorrecao(resposta, contexto, aoMandar) {
  const veu = document.createElement("div"); veu.className = "veu";
  veu.innerHTML = `<div class="folha" role="dialog" aria-modal="true" aria-labelledby="fTit">
    <h2 id="fTit">O que a Nemi devia ter dito?</h2>
    <blockquote>${esc(resposta)}</blockquote>
    <textarea id="fTxt" placeholder="Escreve a resposta certa ou o que tá errado (preço, tom, link, cor…)"></textarea>
    <div class="acoes"><button type="button" class="cancelar">Cancelar</button><button type="button" class="mandar">Mandar correção</button></div></div>`;
  $("app").append(veu);
  const ta = veu.querySelector("textarea"); ta.focus();
  const fecha = () => veu.remove();
  veu.addEventListener("click", (e) => { if (e.target === veu) fecha(); });
  veu.querySelector(".cancelar").onclick = fecha;
  veu.addEventListener("keydown", (e) => { if (e.key === "Escape") fecha(); });
  veu.querySelector(".mandar").onclick = async (ev) => {
    const b = ev.currentTarget; b.disabled = true; b.textContent = "Enviando…";
    try {
      await chamar({ acao: "avaliar", nota: "ruim", correcao: ta.value.trim(), resposta, contexto: contexto() });
      aoMandar(); fecha(); toast("Correção enviada pro Augusto. Valeu!");
    } catch { b.disabled = false; b.textContent = "Mandar correção"; toast("Não foi. Tenta de novo."); }
  };
}

atualizaBotao();
if (codigo && quem) iniciarConversa();
</script>
